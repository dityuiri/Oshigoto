<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Oshigoto Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{{ static_url('css/admin.css') }}">
</head>
<body>
<header>
  <b>おしごと Admin</b>
  <nav>
    {% for key, label in nav %}<a href="/admin/{{ key }}" class="{{ 'on' if key == active }}">{{ label }}</a>{% endfor %}
  </nav>
  <a class="view" href="/" target="_blank">サイトを見る <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
</header>
{% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
{% block content %}{% endblock %}
<script src="{{ static_url('js/admin.js') }}"></script>
</body>
</html>
